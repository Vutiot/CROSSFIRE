<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CROSSFIRE KG Viewer</title>
<script src="https://unpkg.com/cytoscape@3/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base/layout-base.js"></script>
<script src="https://unpkg.com/cose-base/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose/cytoscape-fcose.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0c10;
    --bg-surface: #0d1117;
    --bg-raised: #161b22;
    --bg-overlay: #1c2129;
    --border: #21262d;
    --border-subtle: #151920;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent: #d4a855;
    --accent-dim: rgba(212,168,85,0.15);
    --contra-color: #f47067;
    --contra-dim: rgba(244,112,103,0.12);
    --distractor-color: #a371f7;
    --distractor-dim: rgba(163,113,247,0.12);
    --success: #56d364;
    --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-data: 'IBM Plex Mono', 'Fira Code', monospace;
    --type-person: #79c0ff;
    --type-organization: #d2a8ff;
    --type-equipment: #56d364;
    --type-regulation: #ffa657;
    --type-location: #f778ba;
    --type-temporal: #79c0ff;
    --type-mechanical: #56d364;
    --type-causal: #ffa657;
    --type-procedural: #d2a8ff;
    --type-meteorological: #a5d6ff;
    --type-numeric: #ff7b72;
    --type-personnel: #f778ba;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-ui); background: var(--bg-deep); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Toolbar ── */
  #toolbar {
    background: var(--bg-surface);
    padding: 0 20px;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    flex-shrink: 0;
  }
  #toolbar .brand {
    font-family: var(--font-data);
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 2px;
    font-size: 11px;
    text-transform: uppercase;
  }
  #toolbar .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
  #toolbar .group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    max-height: 28px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #toolbar .group::-webkit-scrollbar { height: 4px; }
  #toolbar .group::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  #type-filters { max-width: 340px; }
  #rel-filters { max-width: 260px; }
  #overlay-toggles { max-width: 220px; }

  /* Custom toggle pills */
  .toggle-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px 3px 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 11px;
    color: var(--text-muted);
    transition: all 0.2s;
    user-select: none;
    flex-shrink: 0;
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toggle-pill.active {
    border-color: transparent;
    color: #fff;
  }
  .toggle-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .toggle-pill.active .dot { background: currentColor; box-shadow: 0 0 6px currentColor; }
  .toggle-pill input { display: none; }

  .toggle-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 11px;
    color: var(--text-secondary);
    transition: all 0.2s;
    user-select: none;
    flex-shrink: 0;
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toggle-chip.active { background: var(--bg-raised); border-color: var(--text-muted); color: var(--text-primary); }
  .toggle-chip input { display: none; }
  .pill-label {
    display: inline-block;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }
  .pill-count {
    display: inline-block;
    font-family: var(--font-data);
    font-size: 9px;
    color: var(--text-muted);
    background: rgba(139,148,158,0.08);
    padding: 1px 5px;
    border-radius: 6px;
    margin-left: 4px;
    min-width: 14px;
    text-align: center;
  }
  .toggle-chip.active .pill-count { color: var(--text-secondary); }

  #toolbar select {
    background: var(--bg-raised);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: border-color 0.2s;
  }
  #toolbar select:hover { border-color: var(--text-muted); }
  #toolbar select:focus { outline: none; border-color: var(--accent); }

  /* Search */
  #search-box {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-family: var(--font-data);
    width: 140px;
    transition: all 0.2s;
  }
  #search-box::placeholder { color: var(--text-muted); }
  #search-box:focus { outline: none; border-color: var(--accent); width: 180px; }

  /* ── Main ── */
  #main { display: flex; flex: 1; overflow: hidden; position: relative; }
  #cy {
    flex: 1;
    background: var(--bg-deep);
    background-image: radial-gradient(circle, var(--border-subtle) 1px, transparent 1px);
    background-size: 18px 18px;
  }

  /* ── Left filter pane ── */
  #filter-pane {
    width: 260px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    flex-shrink: 0;
    padding: 12px 12px 40px;
    transition: width 0.2s, padding 0.2s;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    position: relative;
  }
  #filter-pane::-webkit-scrollbar { width: 5px; }
  #filter-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #filter-pane.collapsed {
    width: 28px;
    padding: 12px 4px;
  }
  #filter-pane.collapsed .filter-section { display: none; }
  #filter-pane-toggle {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-family: var(--font-data);
    font-size: 13px;
    line-height: 1;
    padding: 0;
  }
  #filter-pane.collapsed #filter-pane-toggle { right: 4px; top: 12px; }
  #filter-pane-toggle:hover { color: var(--accent); }
  .filter-section { margin-top: 16px; }
  .filter-section:first-of-type { margin-top: 24px; }
  .filter-section-title {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .filter-section-title .section-hint {
    font-family: var(--font-data);
    font-size: 9px;
    color: var(--text-muted);
    opacity: 0.6;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }
  .filter-section-title .section-reset {
    font-family: var(--font-data);
    font-size: 9px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 4px;
    text-transform: lowercase;
    letter-spacing: 0;
  }
  .filter-section-title .section-reset:hover { color: var(--accent); background: var(--accent-dim); }
  .filter-pill-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  /* Tri-state pills live inside the filter pane */
  .filter-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 11px;
    color: var(--text-muted);
    transition: all 0.15s;
    user-select: none;
    max-width: 100%;
    white-space: nowrap;
  }
  .filter-pill .fp-state {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid var(--border);
    font-family: var(--font-data);
    font-size: 10px;
    line-height: 1;
    color: transparent;
    flex-shrink: 0;
  }
  .filter-pill .fp-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filter-pill .fp-count {
    font-family: var(--font-data);
    font-size: 9px;
    color: var(--text-muted);
    opacity: 0.7;
    flex-shrink: 0;
  }
  .filter-pill[data-state="pos"] {
    background: var(--pill-color, var(--accent-dim));
    border-color: var(--pill-color, var(--accent));
    color: #fff;
  }
  .filter-pill[data-state="pos"] .fp-state {
    background: var(--pill-color, var(--accent));
    border-color: var(--pill-color, var(--accent));
    color: var(--bg-deep);
  }
  .filter-pill[data-state="pos"] .fp-state::before { content: "+"; color: var(--bg-deep); font-weight: 600; }
  .filter-pill[data-state="pos"] .fp-count { color: rgba(255,255,255,0.75); opacity: 1; }
  .filter-pill[data-state="neg"] {
    border-color: var(--contra-color);
    color: var(--contra-color);
    background: var(--contra-dim);
  }
  .filter-pill[data-state="neg"] .fp-state {
    background: var(--contra-color);
    border-color: var(--contra-color);
  }
  .filter-pill[data-state="neg"] .fp-state::before { content: "\2212"; color: var(--bg-deep); font-weight: 600; }
  .filter-pill[data-state="neg"] .fp-label { text-decoration: line-through; opacity: 0.8; }
  .filter-pill[data-state="neg"] .fp-count { color: var(--contra-color); opacity: 0.8; }
  .filter-pill:hover { border-color: var(--text-muted); }
  .filter-pill[data-state="pos"]:hover { filter: brightness(1.1); }
  .filter-pill[data-state="neg"]:hover { border-color: var(--contra-color); filter: brightness(1.1); }

  /* Overlay section: simple on/off chips, not tri-state */
  .overlay-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 11px;
    color: var(--text-muted);
    user-select: none;
    transition: all 0.15s;
  }
  .overlay-toggle .ot-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--overlay-color, var(--accent));
    opacity: 0.35; transition: opacity 0.15s;
  }
  .overlay-toggle.active { color: var(--text-primary); border-color: var(--overlay-color, var(--accent)); background: var(--overlay-dim, var(--accent-dim)); }
  .overlay-toggle.active .ot-dot { opacity: 1; box-shadow: 0 0 4px var(--overlay-color, var(--accent)); }
  .overlay-toggle input { display: none; }

  .pane-select {
    width: 100%;
    background: var(--bg-raised);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-family: var(--font-ui);
    cursor: pointer;
  }
  .pane-select:focus { outline: none; border-color: var(--accent); }

  /* ── Sidebar ── */
  #sidebar {
    width: 360px;
    background: var(--bg-surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    font-size: 13px;
    flex-shrink: 0;
    transition: width 0.25s, border-left-color 0.25s;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #sidebar.collapsed {
    width: 0;
    border-left-color: transparent;
  }
  #sidebar::-webkit-scrollbar { width: 5px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .sidebar-header {
    position: sticky;
    top: 0;
    background: var(--bg-surface);
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  .sidebar-header h3 {
    font-family: var(--font-data);
    font-weight: 500;
    font-size: 15px;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .sidebar-body { padding: 16px 20px; }

  .field { margin-bottom: 14px; }
  .field-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .field-value {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .field-value .mono { font-family: var(--font-data); font-size: 12px; }

  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-family: var(--font-data);
    font-weight: 400;
    margin: 1px 2px;
    border: 1px solid transparent;
  }

  /* Contradiction & distractor cards */
  .card-section { margin-top: 20px; }
  .card-section-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-section-title .count {
    background: var(--bg-raised);
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 10px;
    color: var(--text-secondary);
  }

  .evidence-card {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .evidence-card:hover { border-color: var(--text-muted); }
  .evidence-card.contra { border-left: 3px solid var(--contra-color); }
  .evidence-card.distractor { border-left: 3px solid var(--distractor-color); }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .card-tags .tag { font-size: 9px; }

  .diff-label { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 2px; }
  .diff-block { font-size: 11px; line-height: 1.6; font-family: var(--font-data); }
  .diff-block .removed {
    color: var(--contra-color);
    background: var(--contra-dim);
    text-decoration: line-through;
    padding: 1px 3px;
    border-radius: 2px;
  }
  .diff-block .added {
    color: var(--success);
    background: rgba(86,211,100,0.1);
    padding: 1px 3px;
    border-radius: 2px;
  }
  .card-rationale {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    line-height: 1.5;
    font-style: italic;
  }
  .card-docs {
    font-size: 10px;
    font-family: var(--font-data);
    color: var(--text-muted);
    margin-top: 6px;
  }

  .empty-state {
    color: var(--text-muted);
    text-align: center;
    padding: 60px 20px;
  }
  .empty-state p { margin-bottom: 6px; }
  .empty-state .hint { font-size: 11px; color: var(--border); }

  /* ── Stats bar ── */
  #stats {
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    padding: 5px 20px;
    font-size: 10px;
    font-family: var(--font-data);
    color: var(--text-muted);
    letter-spacing: 0.5px;
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  #stats .stat-val { color: var(--text-secondary); }

  /* ── Drop zone ── */
  #dropzone {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,12,16,0.96);
    z-index: 100;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 12px;
  }
  #dropzone.active { display: flex; }
  #dropzone .drop-title {
    font-family: var(--font-data);
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  #dropzone .drop-hint { font-size: 12px; color: var(--text-muted); }
  #dropzone .drop-border {
    width: 280px;
    height: 160px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: border-color 0.2s;
  }
  body.dragging #dropzone .drop-border { border-color: var(--accent); }

  /* ── Entity type tag colors ── */
  .type-person { background: rgba(121,192,255,0.15); color: var(--type-person); border-color: rgba(121,192,255,0.25); }
  .type-organization { background: rgba(210,168,255,0.15); color: var(--type-organization); border-color: rgba(210,168,255,0.25); }
  .type-equipment { background: rgba(86,211,100,0.15); color: var(--type-equipment); border-color: rgba(86,211,100,0.25); }
  .type-regulation { background: rgba(255,166,87,0.15); color: var(--type-regulation); border-color: rgba(255,166,87,0.25); }
  .type-location { background: rgba(247,120,186,0.15); color: var(--type-location); border-color: rgba(247,120,186,0.25); }
  .type-temporal { background: rgba(121,192,255,0.15); color: var(--type-temporal); border-color: rgba(121,192,255,0.25); }
  .type-mechanical { background: rgba(86,211,100,0.15); color: var(--type-mechanical); border-color: rgba(86,211,100,0.25); }
  .type-causal { background: rgba(255,166,87,0.15); color: var(--type-causal); border-color: rgba(255,166,87,0.25); }
  .type-procedural { background: rgba(210,168,255,0.15); color: var(--type-procedural); border-color: rgba(210,168,255,0.25); }
  .type-meteorological { background: rgba(165,214,255,0.15); color: var(--type-meteorological); border-color: rgba(165,214,255,0.25); }
  .type-numeric { background: rgba(255,123,114,0.15); color: var(--type-numeric); border-color: rgba(255,123,114,0.25); }
  .type-personnel { background: rgba(247,120,186,0.15); color: var(--type-personnel); border-color: rgba(247,120,186,0.25); }
  .type-unknown { background: rgba(139,148,158,0.15); color: var(--text-secondary); border-color: rgba(139,148,158,0.25); }

  /* Mechanism tag colors */
  .mech-numeric_drift { background: rgba(255,166,87,0.18); color: #ffa657; }
  .mech-entity_swap { background: rgba(255,123,114,0.18); color: #ff7b72; }
  .mech-causal_inversion { background: rgba(210,168,255,0.18); color: #d2a8ff; }
  .mech-temporal_contradiction { background: rgba(121,192,255,0.18); color: #79c0ff; }
  .mech-omission_based_implicit { background: rgba(86,211,100,0.18); color: #56d364; }
  .mech-temporal_revision_conflict { background: rgba(212,168,85,0.18); color: #d4a855; }

  /* Inline card trace / hop buttons */
  .inline-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-family: var(--font-data);
    font-size: 10px;
    color: var(--text-secondary);
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .inline-btn:hover { border-color: var(--accent); color: var(--accent); }
  .inline-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .card-section-title .inline-btn { margin-left: auto; }
  .card-tags .inline-btn { font-size: 9px; }

  .hop-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

  /* Shared entities/facts list (doc-view edge sidebar) */
  .shared-list { list-style: none; padding: 0; margin: 0; }
  .shared-list li {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 0;
    font-size: 12px;
    border-bottom: 1px solid var(--bg-raised);
    min-width: 0;
  }
  .shared-list li:last-child { border-bottom: none; }
  .shared-list .mono { font-family: var(--font-data); font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
  .shared-list .muted { color: var(--text-muted); font-size: 11px; white-space: nowrap; margin-left: auto; }
  .shared-list .obj { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .shared-list .vs { color: var(--text-muted); flex: 0 0 auto; }
  .tag.diverges {
    background: rgba(255,165,0,0.15);
    color: #ffb347;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex: 0 0 auto;
  }
  .shared-more {
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 0;
    font-style: italic;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--bg-raised);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 11px;
    font-family: var(--font-data);
    letter-spacing: 0.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand">crossfire</span>
  <div class="sep"></div>
  <select id="dataset-select"></select>
  <div class="sep"></div>
  <input type="text" id="search-box" placeholder="Search nodes...">
  <div class="sep"></div>
  <select id="view-select" style="display:none">
    <option value="documents">Documents</option>
    <option value="entities">Entities</option>
    <option value="claims">Claims</option>
  </select>
  <select id="layout-select">
    <option value="cose">Force-directed</option>
    <option value="circle">Circle</option>
    <option value="grid">Grid</option>
    <option value="breadthfirst">Hierarchy</option>
  </select>
  <select id="color-select" title="Colour nodes by">
    <option value="type">Colour: type</option>
    <option value="cluster">Colour: cluster</option>
  </select>
  <button id="focus-btn" class="inline-btn" title="Keep only currently-visible elements; click again to restore">focus</button>
  <button id="link-btn" class="inline-btn" title="Copy link to this view">link</button>
</div>

<div id="toast"></div>

<div id="main">
  <aside id="filter-pane">
    <button id="filter-pane-toggle" title="Collapse / expand filters">&laquo;</button>
    <div class="filter-section">
      <div class="filter-section-title">
        <span>Entity types</span>
        <span class="section-hint">click: + / &minus; / off</span>
      </div>
      <div id="type-filters" class="filter-pill-list"></div>
    </div>
    <div class="filter-section">
      <div class="filter-section-title">
        <span>Relationships</span>
        <span class="section-hint">click: + / &minus; / off</span>
      </div>
      <div id="rel-filters" class="filter-pill-list"></div>
    </div>
    <div class="filter-section">
      <div class="filter-section-title"><span>Overlays</span></div>
      <div id="overlay-toggles" class="filter-pill-list"></div>
    </div>
    <div class="filter-section">
      <div class="filter-section-title"><span>Scope</span></div>
      <select id="scope-filter" class="pane-select"><option value="all">All scopes</option></select>
    </div>
  </aside>
  <div id="cy"></div>
  <div id="sidebar">
    <div class="empty-state">
      <p>Select a node or edge</p>
      <p class="hint">scroll to zoom / drag to pan</p>
    </div>
  </div>
</div>

<div id="stats"></div>

<div id="dropzone">
  <div class="drop-border">
    <div class="drop-title">DROP FILES</div>
    <div class="drop-hint">entity_graph.json / labels / distractors</div>
  </div>
</div>

<script>
const TYPE_COLORS = {
  person: '#79c0ff', organization: '#d2a8ff', equipment: '#56d364',
  regulation: '#ffa657', location: '#f778ba',
  temporal: '#79c0ff', mechanical: '#56d364', causal: '#ffa657',
  procedural: '#d2a8ff', meteorological: '#a5d6ff', numeric: '#ff7b72',
  personnel: '#f778ba', unknown: '#484f58'
};

// Distinct palette for cluster/community colouring (colour-blind-aware)
const CLUSTER_COLORS = [
  '#79c0ff', '#d2a8ff', '#56d364', '#ffa657', '#f778ba',
  '#a5d6ff', '#ff7b72', '#d4a855', '#56d364', '#a371f7',
  '#f47067', '#7ee787', '#ffb77c', '#c297ff', '#39c5cf',
  '#e6a500', '#6ec0ff', '#b4a0ff', '#ff9e7c', '#68d391',
];

let cy, DATA = null;
let DATASETS = [];
let ACTIVE_VIEW = 'documents';
let COLOR_BY = 'type';              // 'type' | 'cluster'
let CLUSTERS_COMPUTED = false;      // reset on every buildGraph(); gates lazy MCL
let TRACE_ACTIVE_ID = null;         // contradiction id currently traced
let FOCUS_ACTIVE = false;           // true after a commit-focus: elements outside the filter have been removed
let RESTORING = false;              // suppress persistence writes while restoring

const FCOSE_AVAILABLE = !!window.cytoscapeFcose;
if (FCOSE_AVAILABLE) cytoscape.use(window.cytoscapeFcose);

// ── Init ──

async function init() {
  const state = parseHash();
  try {
    // Try multi-dataset endpoint first
    const listResp = await fetch('/api/datasets');
    if (listResp.ok) {
      DATASETS = await listResp.json();
      if (DATASETS.length > 0) {
        buildDatasetSelector();
        const pick = state.ds && DATASETS.includes(state.ds) ? state.ds : DATASETS[0];
        if (state.view) ACTIVE_VIEW = state.view;
        document.getElementById('dataset-select').value = pick;
        await loadDataset(pick, { resetView: false });
        return;
      }
    }
  } catch (_) {}
  // Fallback: single dataset endpoint
  try {
    const resp = await fetch('/api/data');
    if (resp.ok) { DATA = await resp.json(); if (state.view) ACTIVE_VIEW = state.view; render(); return; }
  } catch (_) {}
  setupDragDrop();
}

function buildDatasetSelector() {
  const sel = document.getElementById('dataset-select');
  sel.innerHTML = '';
  DATASETS.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => loadDataset(sel.value));
  sel.style.display = DATASETS.length > 1 ? '' : 'none';
  // Also hide the separator before it if only one dataset
  if (DATASETS.length <= 1) {
    const seps = document.querySelectorAll('#toolbar .sep');
    if (seps[0]) seps[0].style.display = 'none';
  }
}

async function loadDataset(name, opts) {
  try {
    const resp = await fetch(`/api/data/${name}`);
    if (resp.ok) {
      DATA = await resp.json();
      // Preserve the existing ACTIVE_VIEW on initial load (from hash); user-driven
      // dataset switches reset to documents since the new dataset may not have
      // an entity/claims graph of the same shape. Same treatment for focus
      // state — it doesn't carry across datasets.
      if (!opts || opts.resetView !== false) {
        ACTIVE_VIEW = 'documents';
        FOCUS_ACTIVE = false;
      }
      render();
    }
  } catch (err) {
    console.error('Failed to load dataset:', err);
  }
}

function setupDragDrop() {
  const dz = document.getElementById('dropzone');
  dz.classList.add('active');
  const files = {};
  document.body.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
  document.body.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
  document.body.addEventListener('drop', async e => {
    e.preventDefault(); document.body.classList.remove('dragging');
    for (const file of e.dataTransfer.files) {
      const data = JSON.parse(await file.text());
      const name = file.name.toLowerCase();
      if (name.includes('entity_graph') || (data.nodes && data.edges)) files.graph = data;
      else if (name.includes('incoherence') || name.includes('contradiction')) files.contradictions = Array.isArray(data) ? data : [data];
      else if (name.includes('distractor')) files.distractors = Array.isArray(data) ? data : [data];
      else if (data.claims) files.claims = data;
    }
    if (files.graph || files.claims) { DATA = buildPayloadFromFiles(files); dz.classList.remove('active'); render(); }
  });
}

function buildPayloadFromFiles(files) {
  const graph = files.graph || { nodes: [], edges: [] };
  const contradictions = (files.contradictions || []).map((c, i) => {
    if (c.modified_fact && !c.modified_text) { c.modified_text = c.modified_fact; delete c.modified_fact; }
    if (c.original_fact && !c.original_text) { c.original_text = c.original_fact; delete c.original_fact; }
    if (!c.id) c.id = `c_${i}`;
    return c;
  });
  const distractors = files.distractors || [];
  const annotations = {};
  graph.nodes.forEach(n => { annotations[n.id] = { contradiction_ids: [], distractor_ids: [], contradiction_count: 0, distractor_count: 0 }; });
  return { dataset_name: 'local', layout: 'entity_graph', graph, contradictions, distractors, node_annotations: annotations,
    stats: { total_nodes: graph.nodes.length, total_edges: graph.edges.length, total_contradictions: contradictions.length, total_distractors: distractors.length }
  };
}

// ── Render ──

function render() {
  if (cy) { cy.destroy(); cy = null; }
  buildFilters();
  buildGraph();
  updateStats();
  setupSearch();
  applyHashState(parseHash());
  // Pan/zoom & layout events flow into persistence (debounced)
  cy.on('viewport', () => persistState());
}

function _makeTriPill({ key, keyAttr, label, count, color, titleExtra }) {
  const el = document.createElement('div');
  el.className = 'filter-pill';
  el.dataset.state = 'off';
  el.dataset[keyAttr] = key;
  if (color) el.style.setProperty('--pill-color', color);
  el.title = `${label}${titleExtra ? ' — ' + titleExtra : ''}\nclick to cycle: off → include (+) → exclude (−) → off`;
  const state = document.createElement('span');
  state.className = 'fp-state';
  const lbl = document.createElement('span');
  lbl.className = 'fp-label';
  lbl.textContent = label;
  el.appendChild(state);
  el.appendChild(lbl);
  if (count !== undefined) {
    const c = document.createElement('span');
    c.className = 'fp-count';
    c.textContent = count;
    el.appendChild(c);
  }
  el.addEventListener('click', () => {
    const cur = el.dataset.state;
    el.dataset.state = cur === 'off' ? 'pos' : cur === 'pos' ? 'neg' : 'off';
    applyFilters();
    persistState();
  });
  return el;
}

function buildFilters() {
  const isClaims = ACTIVE_VIEW === 'claims' && DATA.claims_graph;
  const isEntities = ACTIVE_VIEW === 'entities' && DATA.entity_graph;
  const activeGraph = isClaims ? DATA.claims_graph : isEntities ? DATA.entity_graph : DATA.graph;

  // Entity-type pills — tri-state, one per distinct type, sorted by node count.
  const typeCounts = new Map();
  activeGraph.nodes.forEach(n => {
    const t = n.entity_type || 'unknown';
    typeCounts.set(t, (typeCounts.get(t) || 0) + 1);
  });
  const types = [...typeCounts.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => k);
  const container = document.getElementById('type-filters');
  container.innerHTML = '';
  types.forEach(t => {
    container.appendChild(_makeTriPill({
      key: t,
      keyAttr: 'type',
      label: t,
      count: typeCounts.get(t),
      color: TYPE_COLORS[t] || '#888',
      titleExtra: `${typeCounts.get(t)} node${typeCounts.get(t) === 1 ? '' : 's'}`,
    }));
  });

  // Relationship-type pills — tri-state, sorted by edge count.
  const relCounts = new Map();
  activeGraph.edges.forEach(e => {
    const k = e.relationship_type || '(none)';
    relCounts.set(k, (relCounts.get(k) || 0) + 1);
  });
  const relTypes = [...relCounts.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => k);
  const relContainer = document.getElementById('rel-filters');
  relContainer.innerHTML = '';
  relTypes.forEach(rt => {
    relContainer.appendChild(_makeTriPill({
      key: rt,
      keyAttr: 'rel',
      label: rt.replace(/_/g, ' '),
      count: relCounts.get(rt),
      titleExtra: `${relCounts.get(rt)} edge${relCounts.get(rt) === 1 ? '' : 's'}`,
    }));
  });

  // Overlay toggles — simple on/off (positive-only semantics make sense here).
  const overlays = document.getElementById('overlay-toggles');
  overlays.innerHTML = '';
  [
    { id: 'show-contradictions', label: 'Contradictions', color: 'var(--contra-color)', dim: 'var(--contra-dim)' },
    { id: 'show-distractors', label: 'Distractors', color: 'var(--distractor-color)', dim: 'var(--distractor-dim)' },
  ].forEach(o => {
    const chip = document.createElement('label');
    chip.className = 'overlay-toggle active';
    chip.style.setProperty('--overlay-color', o.color);
    chip.style.setProperty('--overlay-dim', o.dim);
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true; cb.id = o.id;
    cb.addEventListener('change', function() {
      chip.classList.toggle('active', this.checked);
      applyFilters(); persistState();
    });
    const dot = document.createElement('span');
    dot.className = 'ot-dot';
    chip.appendChild(cb);
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(o.label));
    overlays.appendChild(chip);
  });

  // Scope filter
  const scopes = new Set();
  DATA.contradictions.forEach(c => { if (c.scope) scopes.add(c.scope); });
  DATA.distractors.forEach(d => { if (d.scope) scopes.add(d.scope); });
  const sel = document.getElementById('scope-filter');
  sel.innerHTML = '<option value="all">All scopes</option>';
  scopes.forEach(s => { const opt = document.createElement('option'); opt.value = s; opt.textContent = s.replace(/_/g, ' '); sel.appendChild(opt); });
  sel.onchange = () => { applyFilters(); persistState(); };

  const layoutSel = document.getElementById('layout-select');
  layoutSel.onchange = () => {
    const name = layoutSel.value;
    const opts = { name, animate: true, animationDuration: 600, padding: 20 };
    if (name === 'cose') {
      if (FCOSE_AVAILABLE) {
        opts.name = 'fcose';
        Object.assign(opts, { quality: 'default', randomize: false, numIter: 250, nodeRepulsion: 4500, idealEdgeLength: 55, edgeElasticity: 0.1, nestingFactor: 0.1, gravity: 0.3, packComponents: true });
      } else {
        Object.assign(opts, { nodeRepulsion: 120000, idealEdgeLength: 55, edgeElasticity: 120, gravity: 260, numIter: 1200, componentSpacing: 36 });
      }
    }
    else if (name === 'circle') opts.spacingFactor = 0.8;
    else if (name === 'grid') opts.spacingFactor = 0.7;
    else if (name === 'breadthfirst') opts.spacingFactor = 0.75;
    cy.layout(opts).run();
    persistState();
  };

  // Colour-by (type | cluster)
  const colorSel = document.getElementById('color-select');
  colorSel.value = COLOR_BY;
  colorSel.onchange = () => {
    COLOR_BY = colorSel.value;
    if (COLOR_BY === 'cluster' && !CLUSTERS_COMPUTED) {
      computeClusters();
      CLUSTERS_COMPUTED = true;
    }
    applyColorBy();
    persistState();
  };

  // Copy link
  const linkBtn = document.getElementById('link-btn');
  linkBtn.onclick = () => {
    const url = location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => showToast('link copied'));
    else { prompt('copy this url', url); }
  };

  // Focus / unfocus: commit the current filter as a standalone subgraph
  const focusBtn = document.getElementById('focus-btn');
  focusBtn.onclick = () => (FOCUS_ACTIVE ? exitFocus() : commitFocus());
  if (FOCUS_ACTIVE) { focusBtn.classList.add('active'); focusBtn.textContent = 'unfocus'; }

  // Filter-pane collapse toggle
  const paneToggle = document.getElementById('filter-pane-toggle');
  if (paneToggle) {
    paneToggle.onclick = () => {
      const pane = document.getElementById('filter-pane');
      const collapsed = pane.classList.toggle('collapsed');
      paneToggle.innerHTML = collapsed ? '&raquo;' : '&laquo;';
      if (cy) cy.resize();
    };
  }

  // View toggle (documents / entities / claims) — only for claims-layout datasets
  const viewSel = document.getElementById('view-select');
  if ((DATA.entity_graph && DATA.entity_graph.nodes.length > 0) ||
      (DATA.claims_graph && DATA.claims_graph.nodes.length > 0)) {
    viewSel.style.display = '';
    viewSel.onchange = () => {
      ACTIVE_VIEW = viewSel.value;
      if (cy) { cy.destroy(); cy = null; }
      buildFilters();
      buildGraph();
      updateStats();
    };
  } else {
    viewSel.style.display = 'none';
  }
}

function setupSearch() {
  const box = document.getElementById('search-box');
  box.addEventListener('input', () => {
    const q = box.value.toLowerCase().trim();
    if (!q) { cy.nodes().removeClass('search-dim search-match'); return; }
    cy.batch(() => {
      cy.nodes().forEach(n => {
        const label = (n.data('label') || '').toLowerCase();
        const aliases = (n.data('aliases') || []).join(' ').toLowerCase();
        const subject = (n.data('subject') || '').toLowerCase();
        const obj = (n.data('object') || '').toLowerCase();
        const match = label.includes(q) || aliases.includes(q) || subject.includes(q) || obj.includes(q);
        n.toggleClass('search-match', match);
        n.toggleClass('search-dim', !match);
      });
    });
  });
}

function buildGraph() {
  // cluster_idx data is destroyed with the cy instance, so MCL needs to
  // re-run if/when cluster coloring is re-applied.
  CLUSTERS_COMPUTED = false;
  const elements = [];
  // Pick graph + annotations based on active view
  const isClaims = ACTIVE_VIEW === 'claims' && DATA.claims_graph;
  const isEntities = ACTIVE_VIEW === 'entities' && DATA.entity_graph;
  let graphData, ann;
  if (isClaims) {
    graphData = DATA.claims_graph;
    ann = DATA.claims_annotations || {};
  } else if (isEntities) {
    graphData = DATA.entity_graph;
    ann = DATA.entity_annotations || {};
  } else {
    graphData = DATA.graph;
    ann = DATA.node_annotations || {};
  }
  const isClaimsLayout = isClaims || isEntities || DATA.layout === 'claims';

  graphData.nodes.forEach(n => {
    const a = ann[n.id] || { contradiction_count: 0, distractor_count: 0 };
    const nodeData = {
      id: n.id, label: n.canonical_name || n.id,
      entity_type: n.entity_type || 'unknown',
      aliases: n.aliases || [],
      subcorpus_memberships: n.subcorpus_memberships || [],
      claim_count: n.claim_count || 0,
      category_breakdown: n.category_breakdown || {},
      contradiction_count: a.contradiction_count,
      distractor_count: a.distractor_count,
      contradiction_ids: a.contradiction_ids || [],
      distractor_ids: a.distractor_ids || [],
    };
    if (isClaims) {
      nodeData.confidence = n.confidence || 0;
      nodeData.predicate = n.predicate || '';
      nodeData.object = n.object || '';
      nodeData.subject = n.subject || '';
      nodeData.source_document = n.source_document || '';
    }
    elements.push({ data: nodeData, classes: [n.entity_type || 'unknown'] });
  });

  // Pre-compute a node-id → contradiction-id-set map so we can tag edges
  // whose endpoints both participate in the same contradiction.
  const contraIdsByNode = new Map();
  graphData.nodes.forEach(n => {
    const ids = (ann[n.id] && ann[n.id].contradiction_ids) || [];
    if (ids.length) contraIdsByNode.set(n.id, new Set(ids));
  });

  graphData.edges.forEach((e, i) => {
    const srcContras = contraIdsByNode.get(e.source);
    const tgtContras = contraIdsByNode.get(e.target);
    const shared = [];
    if (srcContras && tgtContras) {
      srcContras.forEach(id => { if (tgtContras.has(id)) shared.push(id); });
    }
    const classes = shared.length ? ['contradiction-edge'] : [];
    elements.push({
      data: {
        id: `e_${i}`,
        source: e.source,
        target: e.target,
        relationship_type: e.relationship_type || '',
        rationale: e.rationale || '',
        weight: e.weight || 0,
        shared_contradictions: shared,
      },
      classes,
    });
  });

  const styleRules = [
    // Base node — tightened for visual density (smaller base size, smaller
    // label, minimum zoom threshold for text so distant nodes don't overlap
    // each other with labels).
    { selector: 'node', style: {
      'label': 'data(label)',
      'text-valign': 'bottom', 'text-halign': 'center',
      'font-family': 'IBM Plex Mono, monospace',
      'font-size': 7, 'font-weight': 300,
      'min-zoomed-font-size': 6,
      'color': '#6e7681', 'text-margin-y': 3,
      'width': 7, 'height': 7,
      'background-color': '#484f58',
      'background-opacity': 0.9,
      'border-width': 0,
      'overlay-padding': 2,
      'transition-property': 'background-color, border-width, border-color, width, height, opacity',
      'transition-duration': '0.2s',
    }},
    // Base edge
    { selector: 'edge', style: {
      'width': 0.5, 'line-color': '#3d444d', 'target-arrow-color': '#3d444d',
      'target-arrow-shape': 'triangle', 'curve-style': 'bezier',
      'opacity': 0.55, 'arrow-scale': 0.4,
      'transition-property': 'opacity, width, line-color',
      'transition-duration': '0.2s',
    }},
    // Shared entities — dotted
    { selector: 'edge[relationship_type="shared_entities"]', style: {
      'opacity': 0.5, 'width': 2, 'line-style': 'dotted',
    }},
    // Shared facts — yellow
    { selector: 'edge[relationship_type="shared_facts"]', style: {
      'opacity': 0.6, 'width': 2, 'line-color': '#d4a855', 'target-arrow-color': '#d4a855',
    }},
    // Selected states
    { selector: 'node:selected', style: { 'border-width': 2, 'border-color': '#d4a855', 'width': 11, 'height': 11 } },
    { selector: 'edge:selected', style: {
      'label': 'data(relationship_type)', 'font-size': 7, 'font-family': 'IBM Plex Mono, monospace',
      'color': '#8b949e', 'text-rotation': 'autorotate', 'text-margin-y': -6,
      'opacity': 1, 'width': 1.5, 'line-color': '#d4a855', 'target-arrow-color': '#d4a855',
    }},
    // Neighborhood highlighting
    { selector: 'node.neighbor', style: { 'opacity': 1, 'width': 9, 'height': 9, 'color': '#c9d1d9' } },
    { selector: 'edge.neighbor', style: { 'opacity': 0.85, 'width': 1, 'line-color': '#525a63', 'target-arrow-color': '#525a63' } },
    { selector: 'node.dimmed', style: { 'opacity': 0.15 } },
    { selector: 'edge.dimmed', style: { 'opacity': 0.06 } },
    // Search
    { selector: 'node.search-match', style: { 'border-width': 2, 'border-color': '#d4a855', 'color': '#d4a855', 'width': 11, 'height': 11 } },
    { selector: 'node.search-dim', style: { 'opacity': 0.2 } },
    // Contradiction edges — endpoints share at least one contradiction id
    { selector: 'edge.contradiction-edge', style: {
      'line-color': '#f47067', 'target-arrow-color': '#f47067',
      'line-style': 'dashed', 'width': 1.5, 'opacity': 0.85,
      'z-index': 10,
    }},
    // Trace mode — show only the isolated subgraph at full opacity
    { selector: 'node.trace-member', style: { 'opacity': 1, 'border-width': 2, 'border-color': '#f47067' } },
    { selector: 'edge.trace-member', style: { 'opacity': 1, 'width': 2, 'line-color': '#f47067', 'target-arrow-color': '#f47067' } },
    // Hidden
    { selector: '.hidden', style: { 'display': 'none' } },
  ];

  // Entity type colors
  Object.entries(TYPE_COLORS).forEach(([type, color]) => {
    styleRules.push({ selector: `node.${type}`, style: { 'background-color': color } });
  });

  // Contradiction border
  styleRules.push({ selector: 'node[contradiction_count > 0]', style: {
    'border-width': 'mapData(contradiction_count, 0, 30, 1, 2.5)',
    'border-color': '#f47067',
  }});
  // Distractor border
  styleRules.push({ selector: 'node[distractor_count > 0]', style: {
    'border-style': 'dashed', 'border-width': 1, 'border-color': '#a371f7',
  }});
  // Both
  styleRules.push({ selector: 'node[contradiction_count > 0][distractor_count > 0]', style: {
    'border-width': 'mapData(contradiction_count, 0, 30, 1, 2.5)',
    'border-color': '#f47067', 'border-style': 'dashed',
  }});

  // View-specific node sizing — shrunk to match the denser base.
  if (isClaims) {
    styleRules.push({ selector: 'node[confidence > 0]', style: {
      'width': 'mapData(confidence, 0.7, 1.0, 4, 12)', 'height': 'mapData(confidence, 0.7, 1.0, 4, 12)'
    }});
  } else if (isClaimsLayout) {
    styleRules.push({ selector: 'node[claim_count > 0]', style: {
      'width': 'mapData(claim_count, 1, 100, 6, 20)', 'height': 'mapData(claim_count, 1, 100, 6, 20)'
    }});
  }

  // Compact force-directed layout — tighter node-to-node spacing and
  // stronger gravity so communities cluster visibly and more of them fit
  // onscreen at once. fcose: spectral pre-positioning, ~10x fewer iters
  // than cose for similar quality on dense graphs.
  const claimsLayout = FCOSE_AVAILABLE
    ? { name: 'fcose', animate: false, fit: true, padding: 20, quality: 'default', randomize: false, numIter: 250, nodeRepulsion: 4500, idealEdgeLength: 32, edgeElasticity: 0.1, nestingFactor: 0.1, gravity: 0.4, packComponents: true }
    : { name: 'cose',  animate: false, fit: true, padding: 20, nodeRepulsion: 60000, idealEdgeLength: 32, edgeElasticity: 120, nestingFactor: 4, gravity: 320, numIter: 1200, initialTemp: 200, coolingFactor: 0.95, minTemp: 1.0, componentSpacing: 18 };
  const otherLayout = FCOSE_AVAILABLE
    ? { name: 'fcose', animate: false, fit: true, padding: 20, quality: 'proof',   randomize: false, numIter: 400, nodeRepulsion: 6000, idealEdgeLength: 55, edgeElasticity: 0.1, nestingFactor: 0.1, gravity: 0.3, packComponents: true }
    : { name: 'cose',  animate: false, fit: true, padding: 20, nodeRepulsion: 120000, idealEdgeLength: 55, edgeElasticity: 120, nestingFactor: 4, gravity: 260, numIter: 1200, initialTemp: 200, coolingFactor: 0.95, minTemp: 1.0, componentSpacing: 36 };
  const layoutOpts = isClaims ? claimsLayout : otherLayout;

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: styleRules,
    layout: layoutOpts,
    minZoom: 0.2, maxZoom: 5,
    hideEdgesOnViewport: true,
    hideLabelsOnViewport: true,
    textureOnViewport: true,
    motionBlur: false,
    pixelRatio: 1,
  });

  // Community detection (built-in Markov Clustering). Lazy: only pay for
  // MCL when the user is actually viewing cluster coloring. Falls back
  // silently on empty graphs or if the algorithm errors on disconnected inputs.
  if (COLOR_BY === 'cluster') {
    computeClusters();
    CLUSTERS_COMPUTED = true;
  }
  applyColorBy();

  // Interactions
  cy.on('tap', 'node', e => {
    TRACE_ACTIVE_ID = null;
    highlightNeighborhood(e.target);
    showNodeDetails(e.target.data());
    openSidebar();
    persistState();
  });
  cy.on('tap', 'edge', e => {
    showEdgeDetails(e.target.data());
    openSidebar();
  });
  cy.on('tap', e => {
    if (e.target === cy) {
      TRACE_ACTIVE_ID = null;
      resetHighlight();
      clearSidebar();
      closeSidebar();
      persistState();
    }
  });
}

function openSidebar() {
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('collapsed')) {
    sb.classList.remove('collapsed');
    if (cy) cy.resize();
  }
}

function closeSidebar() {
  const sb = document.getElementById('sidebar');
  if (!sb.classList.contains('collapsed')) {
    sb.classList.add('collapsed');
    if (cy) cy.resize();
  }
}

// ── Clustering ──

function computeClusters() {
  if (!cy || cy.nodes().length === 0) return;
  try {
    // Markov clustering on the visible graph. Weights bias clusters toward
    // tightly-connected subgraphs (shared_facts > shared_entities).
    const clusters = cy.elements().markovClustering({
      attributes: [ function(edge) { return edge.data('weight') || 1; } ],
      expandFactor: 2,
      inflateFactor: 2,
      maxIterations: 20,
    }) || [];
    clusters.forEach((cluster, idx) => {
      cluster.nodes().forEach(n => n.data('cluster_idx', idx));
    });
    // Any orphan not touched by clustering → its own group
    cy.nodes().forEach(n => { if (n.data('cluster_idx') === undefined) n.data('cluster_idx', -1); });
  } catch (err) {
    console.warn('markovClustering failed, skipping cluster colouring', err);
  }
}

function applyColorBy() {
  if (!cy) return;
  if (COLOR_BY === 'cluster') {
    cy.nodes().forEach(n => {
      const idx = n.data('cluster_idx');
      const color = (idx === undefined || idx < 0) ? '#484f58' : CLUSTER_COLORS[idx % CLUSTER_COLORS.length];
      n.style('background-color', color);
    });
  } else {
    // Remove our override so the stylesheet's entity-type rule takes over again
    cy.nodes().removeStyle('background-color');
  }
}

// ── Neighborhood Highlight ──

function highlightNeighborhood(node) {
  resetHighlight();
  const neighborhood = node.neighborhood().add(node);
  cy.elements().not(neighborhood).addClass('dimmed');
  neighborhood.edges().addClass('neighbor');
  neighborhood.nodes().not(node).addClass('neighbor');
}

function resetHighlight() {
  cy.elements().removeClass('dimmed neighbor trace-member');
}

// ── Filters ──

// Read tri-state pills. Returns { pos: Set, neg: Set } per dataset attribute.
function _readTriState(containerId, keyAttr) {
  const pos = new Set(), neg = new Set();
  document.querySelectorAll(`#${containerId} .filter-pill`).forEach(p => {
    const key = p.dataset[keyAttr];
    if (p.dataset.state === 'pos') pos.add(key);
    else if (p.dataset.state === 'neg') neg.add(key);
  });
  return { pos, neg };
}

// Tri-state membership test:
//   - if `neg` contains the key → hide
//   - else if `pos` is non-empty and does NOT contain the key → hide
//   - else → show
function _triPasses(key, pos, neg) {
  if (neg.has(key)) return false;
  if (pos.size > 0 && !pos.has(key)) return false;
  return true;
}

function applyFilters() {
  const showContra = document.getElementById('show-contradictions').checked;
  const showDist = document.getElementById('show-distractors').checked;
  const scopeFilter = document.getElementById('scope-filter').value;
  const typeFilter = _readTriState('type-filters', 'type');
  const relFilter = _readTriState('rel-filters', 'rel');

  const activeContraIds = new Set();
  const activeDistIds = new Set();
  if (showContra) DATA.contradictions.forEach(c => { if (scopeFilter === 'all' || c.scope === scopeFilter) activeContraIds.add(c.id); });
  if (showDist) DATA.distractors.forEach(d => { if (scopeFilter === 'all' || d.scope === scopeFilter) activeDistIds.add(d.id); });

  cy.batch(() => {
    cy.nodes().forEach(node => {
      const d = node.data();
      if (!_triPasses(d.entity_type, typeFilter.pos, typeFilter.neg)) { node.addClass('hidden'); return; }
      node.removeClass('hidden');
      node.data('contradiction_count', (d.contradiction_ids || []).filter(id => activeContraIds.has(id)).length);
      node.data('distractor_count', (d.distractor_ids || []).filter(id => activeDistIds.has(id)).length);
    });
    cy.edges().forEach(edge => {
      const relKey = edge.data('relationship_type') || '(none)';
      const relOk = _triPasses(relKey, relFilter.pos, relFilter.neg);
      const endpointOk = !edge.source().hasClass('hidden') && !edge.target().hasClass('hidden');
      edge.toggleClass('hidden', !(relOk && endpointOk));
    });
  });
}

// ── Contradiction trace & N-hop isolation ──

function traceContradiction(cid) {
  if (!cy) return;
  resetHighlight();
  clearTrace();
  TRACE_ACTIVE_ID = cid;
  // Nodes participating in this contradiction
  const members = cy.nodes().filter(n => (n.data('contradiction_ids') || []).includes(cid));
  if (members.length === 0) return;
  // Edges among those nodes + edges that explicitly share the same contradiction id
  const memberEdges = members.edgesWith(members);
  const sharedEdges = cy.edges().filter(e => (e.data('shared_contradictions') || []).includes(cid));
  const traceSet = members.union(memberEdges).union(sharedEdges);
  cy.elements().addClass('dimmed');
  traceSet.removeClass('dimmed').addClass('trace-member');
  cy.animate({ fit: { eles: traceSet, padding: 80 } }, { duration: 400 });
  persistState();
}

function clearTrace() {
  if (!cy) return;
  cy.elements().removeClass('trace-member dimmed');
  TRACE_ACTIVE_ID = null;
}

function isolateHop(nodeId, hops) {
  if (!cy) return;
  const start = cy.getElementById(nodeId);
  if (!start || start.empty()) return;
  // BFS up to `hops` distance
  let frontier = start;
  let included = start;
  for (let i = 0; i < hops; i++) {
    const next = frontier.openNeighborhood('node');
    included = included.union(frontier.connectedEdges()).union(next);
    frontier = next;
  }
  included = included.union(included.connectedEdges().filter(e => included.contains(e.source()) && included.contains(e.target())));
  cy.batch(() => {
    cy.elements().addClass('hidden');
    included.removeClass('hidden');
  });
  cy.animate({ fit: { eles: included, padding: 80 } }, { duration: 400 });
  showToast(`isolated ${hops}-hop neighbourhood`);
}

function resetIsolation() {
  if (!cy) return;
  cy.batch(() => {
    cy.elements().removeClass('hidden');
    applyFilters(); // re-apply current filter state on top
  });
  showToast('reset');
}

// ── Focus: commit the current filter as a standalone subgraph ──
//
// One-way operation: the elements outside the filter are removed from cy,
// layout is re-run on the survivors, and the focus flag is serialised to the
// URL hash. Exiting focus clears the hash param and re-fetches the dataset.

function commitFocus() {
  if (!cy) return;
  const searchActive = (document.getElementById('search-box').value || '').trim() !== '';
  const keepNodes = cy.nodes().filter(n =>
    !n.hasClass('hidden') && (!searchActive || n.hasClass('search-match'))
  );
  if (keepNodes.length === 0) { showToast('no visible nodes to focus on'); return; }
  const keepEdges = cy.edges().filter(e =>
    !e.hasClass('hidden') && keepNodes.contains(e.source()) && keepNodes.contains(e.target())
  );
  const keep = keepNodes.union(keepEdges);
  cy.elements().not(keep).remove();
  cy.elements().removeClass('hidden search-dim search-match trace-member dimmed neighbor');
  TRACE_ACTIVE_ID = null;
  const layoutName = document.getElementById('layout-select').value || 'cose';
  const opts = { name: layoutName, animate: true, animationDuration: 500, padding: 20, fit: true };
  if (layoutName === 'cose') {
    if (FCOSE_AVAILABLE) {
      opts.name = 'fcose';
      Object.assign(opts, { quality: 'default', randomize: false, numIter: 250, nodeRepulsion: 4500, idealEdgeLength: 55, edgeElasticity: 0.1, nestingFactor: 0.1, gravity: 0.3, packComponents: true });
    } else {
      Object.assign(opts, { nodeRepulsion: 120000, idealEdgeLength: 55, edgeElasticity: 120, gravity: 260, numIter: 1200, componentSpacing: 36 });
    }
  }
  cy.layout(opts).run();
  FOCUS_ACTIVE = true;
  const btn = document.getElementById('focus-btn');
  btn.classList.add('active');
  btn.textContent = 'unfocus';
  updateStats();
  persistState();
  showToast(`focused on ${keepNodes.length} node${keepNodes.length === 1 ? '' : 's'}`);
}

function exitFocus() {
  FOCUS_ACTIVE = false;
  // Strip the focus param from the hash before the dataset re-fetch so the
  // reloaded data doesn't immediately re-commit.
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  p.delete('fc');
  history.replaceState(null, '', '#' + p.toString());
  const btn = document.getElementById('focus-btn');
  if (btn) { btn.classList.remove('active'); btn.textContent = 'focus'; }
  const name = (DATA && DATA.dataset_name);
  if (name && DATASETS.includes(name)) {
    loadDataset(name, { resetView: false });
  } else {
    location.reload();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 1500);
}

// ── Sidebar ──

function clearSidebar() {

}

// Map a subject string to an entity-type label. First consult the
// server-classified entity_graph (subjects with >= min_claims claims), then fall
// back to a small prefix table that handles long-tail subjects below the
// classifier's threshold. Datasets that don't match any prefix get "other".
const ENTITY_TYPE_PREFIXES = [
  ["Officer-", "officer"], ["Subject-", "complainant"], ["Witness-", "witness"],
  ["Location-", "address"], ["Area-", "neighborhood"],
  ["Case-", "case_identifier"], ["Log-", "log_number"], ["Event-", "event_number"],
  ["Badge-", "badge_number"],
  ["Civilian-", "civilian"], ["Administrator-", "administrator"], ["Judge-", "judge"],
  ["POD-", "pod_camera"],
];
function entityTypeOf(subj) {
  if (DATA && DATA.entity_graph && Array.isArray(DATA.entity_graph.nodes)) {
    const n = DATA.entity_graph.nodes.find(x => x.id === subj);
    if (n && n.entity_type && n.entity_type !== "unknown") return n.entity_type;
  }
  for (const [pre, t] of ENTITY_TYPE_PREFIXES) if (subj.startsWith(pre)) return t;
  return "other";
}
function groupBy(arr, keyFn) {
  const out = new Map();
  for (const x of arr) {
    const k = keyFn(x);
    if (!out.has(k)) out.set(k, []);
    out.get(k).push(x);
  }
  return out;
}

// Render a single shared-fact row. When includeSubject is true, the subject
// chip is shown inline (used for the flat list when there are <=5 shared facts).
function renderSharedFactRow(r, includeSubject) {
  let html = `<li>`;
  if (includeSubject) {
    html += `<span class="tag type-${esc(entityTypeOf(r.subject))}">${esc(r.subject)}</span>`;
  }
  html += `<span class="mono">${esc(r.predicate)}</span>`;
  if (r.diverges) {
    html += `<span class="obj" title="${esc(String(r.objA))}">${esc(trunc(String(r.objA), 80))}</span>`;
    html += `<span class="vs">|</span>`;
    html += `<span class="obj" title="${esc(String(r.objB))}">${esc(trunc(String(r.objB), 80))}</span>`;
    html += `<span class="tag diverges">diverges</span>`;
  } else {
    html += `<span class="obj" title="${esc(String(r.objA))}">${esc(trunc(String(r.objA), 120))}</span>`;
  }
  html += `</li>`;
  return html;
}

// Build the "Shared entities" panel for a doc-view edge: subjects mentioned
// in both docs, grouped by entity-type. Singleton groups are folded into a
// final "Other" bucket once there are 4+ groups, to keep the panel scannable.
function buildSharedEntitiesPanel(srcId, tgtId) {
  const inSrc = new Map(), inTgt = new Map();
  for (const c of DATA.claims || []) {
    if (c.source_document === srcId) inSrc.set(c.subject, (inSrc.get(c.subject) || 0) + 1);
    else if (c.source_document === tgtId) inTgt.set(c.subject, (inTgt.get(c.subject) || 0) + 1);
  }
  const shared = [...inSrc.keys()].filter(s => inTgt.has(s));
  if (!shared.length) return '';

  const groups = groupBy(shared, s => entityTypeOf(s));
  const sorted = [...groups.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  let main = sorted, footer = [];
  if (sorted.length >= 4) {
    main = sorted.filter(([_, items]) => items.length > 1);
    footer = sorted.filter(([_, items]) => items.length === 1)
                   .flatMap(([t, items]) => items.map(s => ({ type: t, subject: s })));
  }

  let html = `<div class="card-section"><div class="card-section-title">Shared entities <span class="count">${shared.length}</span></div>`;
  for (const [type, subjects] of main) {
    subjects.sort((a, b) => (inSrc.get(b) + inTgt.get(b)) - (inSrc.get(a) + inTgt.get(a)) || a.localeCompare(b));
    html += `<div class="card-section" style="margin-top:12px">`;
    html += `<div class="card-section-title"><span class="tag type-${esc(type)}">${esc(type)}</span> <span class="count">${subjects.length}</span></div>`;
    html += `<ul class="shared-list">`;
    const display = subjects.slice(0, 50);
    for (const s of display) {
      html += `<li><span class="obj" title="${esc(s)}">${esc(s)}</span><span class="muted">${inSrc.get(s)} / ${inTgt.get(s)}</span></li>`;
    }
    if (subjects.length > 50) html += `<li class="shared-more">…and ${subjects.length - 50} more</li>`;
    html += `</ul></div>`;
  }
  if (footer.length) {
    footer.sort((a, b) => a.type.localeCompare(b.type) || a.subject.localeCompare(b.subject));
    html += `<div class="card-section" style="margin-top:12px">`;
    html += `<div class="card-section-title">Other <span class="count">${footer.length}</span></div>`;
    html += `<ul class="shared-list">`;
    for (const f of footer) {
      html += `<li><span class="tag type-${esc(f.type)}">${esc(f.type)}</span><span class="obj" title="${esc(f.subject)}">${esc(f.subject)}</span><span class="muted">${inSrc.get(f.subject)} / ${inTgt.get(f.subject)}</span></li>`;
    }
    html += `</ul></div>`;
  }
  html += `</div>`;
  return html;
}

// Build the "Shared facts" panel: (subject, predicate) tuples both docs claim.
// Predicate noise is severe (~80-98% singletons across datasets), so we group by
// SUBJECT instead of predicate. Below 5 shared facts, render a flat list.
function buildSharedFactsPanel(srcId, tgtId) {
  const SEP = "";
  const srcFacts = new Map(), tgtFacts = new Map();
  for (const c of DATA.claims || []) {
    if (c.source_document === srcId) srcFacts.set(c.subject + SEP + c.predicate, c);
    else if (c.source_document === tgtId) tgtFacts.set(c.subject + SEP + c.predicate, c);
  }
  const sharedKeys = [...srcFacts.keys()].filter(k => tgtFacts.has(k));
  if (!sharedKeys.length) return '';

  const rows = sharedKeys.map(k => {
    const a = srcFacts.get(k), b = tgtFacts.get(k);
    return {
      subject: a.subject,
      predicate: a.predicate,
      objA: a.object,
      objB: b.object,
      diverges: String(a.object) !== String(b.object),
    };
  });

  let html = `<div class="card-section"><div class="card-section-title">Shared facts <span class="count">${rows.length}</span></div>`;

  if (rows.length <= 5) {
    rows.sort((a, b) => a.subject.localeCompare(b.subject) || a.predicate.localeCompare(b.predicate));
    html += `<ul class="shared-list">`;
    for (const r of rows) html += renderSharedFactRow(r, true);
    html += `</ul>`;
  } else {
    const groups = groupBy(rows, r => r.subject);
    const sorted = [...groups.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
    for (const [subj, items] of sorted) {
      items.sort((a, b) => a.predicate.localeCompare(b.predicate));
      html += `<div class="card-section" style="margin-top:12px">`;
      html += `<div class="card-section-title"><span class="tag type-${esc(entityTypeOf(subj))}">${esc(subj)}</span> <span class="count">${items.length}</span></div>`;
      html += `<ul class="shared-list">`;
      for (const r of items) html += renderSharedFactRow(r, false);
      html += `</ul></div>`;
    }
  }
  html += `</div>`;
  return html;
}

function showEdgeDetails(d) {
  const sb = document.getElementById('sidebar');
  const src = cy.getElementById(d.source).data();
  const tgt = cy.getElementById(d.target).data();
  let html = `<div class="sidebar-header"><h3>${esc(d.relationship_type || 'Edge')}</h3></div>`;
  html += `<div class="sidebar-body">`;
  html += field('Source', `<span class="tag type-${src.entity_type}">${esc(src.label)}</span>`);
  html += field('Target', `<span class="tag type-${tgt.entity_type}">${esc(tgt.label)}</span>`);
  html += field('Type', `<span class="mono">${d.relationship_type}</span>`);
  if (d.rationale) {
    html += field('Rationale', `<span style="line-height:1.5">${esc(d.rationale)}</span>`);
  }
  if (d.weight) html += field('Weight', d.weight);
  if (d.relationship_type === 'shared_entities') {
    html += buildSharedEntitiesPanel(d.source, d.target);
  } else if (d.relationship_type === 'shared_facts') {
    html += buildSharedFactsPanel(d.source, d.target);
  }
  html += '</div>';
  sb.innerHTML = html;
}

function contradictionCard(c) {
  const traceActive = TRACE_ACTIVE_ID === c.id;
  let html = `<div class="evidence-card contra"><div class="card-tags">`;
  html += `<span class="tag mech-${c.mechanism || 'unknown'}">${(c.mechanism||'unknown').replace(/_/g,' ')}</span>`;
  html += `<span class="tag" style="background:rgba(139,148,158,0.1);color:var(--text-secondary)">${(c.scope||'').replace(/_/g,' ')}</span>`;
  if (c.detectability) html += `<span class="tag" style="background:rgba(139,148,158,0.1);color:var(--text-muted)">${c.detectability.replace(/_/g,' ')}</span>`;
  if (c.difficulty) html += `<span class="tag" style="background:rgba(139,148,158,0.1);color:var(--text-muted)">${c.difficulty}</span>`;
  html += `<button class="inline-btn${traceActive ? ' active' : ''}" data-action="${traceActive ? 'untrace' : 'trace'}" data-cid="${esc(c.id)}">${traceActive ? 'untrace' : 'trace'}</button>`;
  html += `</div>`;
  if (c.original_text) html += `<div class="diff-label">original</div><div class="diff-block"><span class="removed">${esc(trunc(c.original_text, 180))}</span></div>`;
  if (c.modified_text) html += `<div class="diff-label" style="margin-top:6px">injected</div><div class="diff-block"><span class="added">${esc(trunc(c.modified_text, 180))}</span></div>`;
  if (c.rationale) html += `<div class="diff-label" style="margin-top:6px">rationale</div><div class="card-rationale">${esc(trunc(c.rationale, 250))}</div>`;
  if ((c.scope === 'inter_doc' || c.scope === 'inter_corpus') && (c.document_references||[]).length > 1) {
    html += `<div class="diff-label" style="margin-top:6px">contradicting document</div>`;
    html += `<div class="card-docs">${esc(c.document_references[1])}</div>`;
  }
  html += `<div class="diff-label" style="margin-top:6px">documents</div><div class="card-docs">${(c.document_references||[]).join(' / ')}</div></div>`;
  return html;
}

function distractorCard(d) {
  let html = `<div class="evidence-card distractor"><div class="card-tags">`;
  html += `<span class="tag" style="background:rgba(163,113,247,0.15);color:var(--distractor-color)">${(d.divergence_type||'').replace(/_/g,' ')}</span>`;
  html += `<span class="tag" style="background:rgba(139,148,158,0.1);color:var(--text-secondary)">${(d.scope||'').replace(/_/g,' ')}</span>`;
  html += `</div>`;
  if (d.description) html += `<div style="font-size:12px;color:var(--text-secondary);line-height:1.5">${esc(trunc(d.description, 280))}</div>`;
  html += `<div class="card-docs">${(d.document_references||[]).join(' / ')}</div></div>`;
  return html;
}

// ── Helpers ──

function field(label, value) { return `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`; }
function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function trunc(s, n) { return s && s.length > n ? s.slice(0,n) + '\u2026' : s; }

function updateStats() {
  const s = DATA.stats;
  const el = document.getElementById('stats');
  const sep = ' <span style="color:var(--border)">/</span> ';
  let html = `<span>${DATA.dataset_name}</span>${sep}`;
  if (FOCUS_ACTIVE && cy) {
    // In focus mode the live graph is the authoritative count; still show
    // the dataset totals for reference so the user sees "N of M".
    const curNodes = cy.nodes().length;
    const curEdges = cy.edges().length;
    const totalNodes = (ACTIVE_VIEW === 'entities' && DATA.entity_graph) ? DATA.entity_graph.nodes.length
                     : (ACTIVE_VIEW === 'claims' && DATA.claims_graph) ? DATA.claims_graph.nodes.length
                     : s.total_nodes;
    const totalEdges = (ACTIVE_VIEW === 'entities' && DATA.entity_graph) ? DATA.entity_graph.edges.length
                     : (ACTIVE_VIEW === 'claims' && DATA.claims_graph) ? DATA.claims_graph.edges.length
                     : s.total_edges;
    html += `<span style="color:var(--accent)">focused</span>${sep}`;
    html += `<span>nodes <span class="stat-val">${curNodes} / ${totalNodes}</span></span>${sep}`;
    html += `<span>edges <span class="stat-val">${curEdges} / ${totalEdges}</span></span>`;
    el.innerHTML = html;
    return;
  }
  if (ACTIVE_VIEW === 'claims' && DATA.claims_graph) {
    html += `<span>claims <span class="stat-val">${s.total_claims}</span></span>${sep}`;
    html += `<span>cross-refs <span class="stat-val">${s.total_cross_references}</span></span>${sep}`;
    html += `<span>edges <span class="stat-val">${DATA.claims_graph.edges.length}</span></span>${sep}`;
    html += `<span>contradictions <span class="stat-val">${s.total_contradictions}</span></span>`;
  } else {
    html += `<span>nodes <span class="stat-val">${s.total_nodes}</span></span>${sep}`;
    html += `<span>edges <span class="stat-val">${s.total_edges}</span></span>${sep}`;
    html += `<span>contradictions <span class="stat-val">${s.total_contradictions}</span></span>${sep}`;
    html += `<span>distractors <span class="stat-val">${s.total_distractors}</span></span>`;
    if (s.total_claims) html += `${sep}<span>claims <span class="stat-val">${s.total_claims}</span></span>`;
  }
  el.innerHTML = html;
}

// ── Sidebar action delegation ──

function setupSidebarActions() {
  document.getElementById('sidebar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'trace') traceContradiction(btn.dataset.cid);
    else if (action === 'untrace') { clearTrace(); const n = cy.$(':selected'); if (n.length) showNodeDetails(n.data()); else clearSidebar(); }
    else if (action === 'hop1') isolateHop(btn.dataset.node, 1);
    else if (action === 'hop2') isolateHop(btn.dataset.node, 2);
    else if (action === 'reset-isolation') resetIsolation();
  });
}

// ── URL-hash view persistence ──
//
// Serialise enough state so a copied URL restores the same view:
// dataset, active view, enabled entity-type / relationship-type / overlay
// filters, scope, layout, colour mode, selected node, and pan/zoom.

function persistState() {
  if (RESTORING || !cy) return;
  clearTimeout(persistState._timer);
  persistState._timer = setTimeout(_persistNow, 150);
}

function _persistNow() {
  if (!cy) return;
  const typeFilter = _readTriState('type-filters', 'type');
  const relFilter = _readTriState('rel-filters', 'rel');
  const contraOn = document.getElementById('show-contradictions')?.checked;
  const distOn = document.getElementById('show-distractors')?.checked;
  const scope = document.getElementById('scope-filter')?.value || 'all';
  const layout = document.getElementById('layout-select')?.value || 'cose';
  const selected = cy.$('node:selected');
  const params = new URLSearchParams();
  params.set('ds', DATA && DATA.dataset_name ? DATA.dataset_name : '');
  if (ACTIVE_VIEW !== 'documents') params.set('v', ACTIVE_VIEW);
  if (typeFilter.pos.size) params.set('t+', [...typeFilter.pos].join(','));
  if (typeFilter.neg.size) params.set('t-', [...typeFilter.neg].join(','));
  if (relFilter.pos.size) params.set('r+', [...relFilter.pos].join(','));
  if (relFilter.neg.size) params.set('r-', [...relFilter.neg].join(','));
  if (!contraOn) params.set('xc', '1');
  if (!distOn) params.set('xd', '1');
  if (scope !== 'all') params.set('sc', scope);
  if (layout !== 'cose') params.set('lo', layout);
  if (COLOR_BY !== 'type') params.set('cb', COLOR_BY);
  if (selected.length) params.set('sel', selected.id());
  if (TRACE_ACTIVE_ID) params.set('tr', TRACE_ACTIVE_ID);
  if (FOCUS_ACTIVE) params.set('fc', '1');
  const zoom = cy.zoom();
  const pan = cy.pan();
  params.set('z', zoom.toFixed(3));
  params.set('p', `${pan.x.toFixed(0)},${pan.y.toFixed(0)}`);
  const newHash = '#' + params.toString();
  if (location.hash !== newHash) history.replaceState(null, '', newHash);
}

function parseHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return {};
  const p = new URLSearchParams(raw);
  const splitCSV = (s) => (s ? s.split(',') : []);
  return {
    ds: p.get('ds'),
    view: p.get('v'),
    tPos: splitCSV(p.get('t+')),
    tNeg: splitCSV(p.get('t-')),
    rPos: splitCSV(p.get('r+')),
    rNeg: splitCSV(p.get('r-')),
    // Back-compat: older URLs used xt/xr for "excluded" — map them onto the
    // new negative set so existing saved links still work.
    xt: splitCSV(p.get('xt')),
    xr: splitCSV(p.get('xr')),
    xc: p.get('xc') === '1',
    xd: p.get('xd') === '1',
    scope: p.get('sc'),
    layout: p.get('lo'),
    color: p.get('cb'),
    sel: p.get('sel'),
    trace: p.get('tr'),
    focus: p.get('fc') === '1',
    zoom: p.get('z') ? parseFloat(p.get('z')) : null,
    pan: p.get('p') ? p.get('p').split(',').map(Number) : null,
  };
}

function applyHashState(state) {
  if (!state || !cy) return;
  // If the hash belongs to a different dataset, don't restore per-dataset
  // artefacts (selection / trace / zoom-pan) — node ids won't match.
  const dsMatches = !state.ds || (DATA && DATA.dataset_name === state.ds);
  RESTORING = true;
  try {
    // Tri-state pill restoration. Legacy `xt` / `xr` params (excluded sets)
    // are folded into the negative set so old URLs still work.
    const typePos = new Set(state.tPos || []);
    const typeNeg = new Set([...(state.tNeg || []), ...(state.xt || [])]);
    const relPos = new Set(state.rPos || []);
    const relNeg = new Set([...(state.rNeg || []), ...(state.xr || [])]);
    document.querySelectorAll('#type-filters .filter-pill').forEach(p => {
      const k = p.dataset.type;
      p.dataset.state = typePos.has(k) ? 'pos' : typeNeg.has(k) ? 'neg' : 'off';
    });
    document.querySelectorAll('#rel-filters .filter-pill').forEach(p => {
      const k = p.dataset.rel;
      p.dataset.state = relPos.has(k) ? 'pos' : relNeg.has(k) ? 'neg' : 'off';
    });
    if (state.xc) { const el = document.getElementById('show-contradictions'); if (el) { el.checked = false; el.closest('.overlay-toggle').classList.remove('active'); } }
    if (state.xd) { const el = document.getElementById('show-distractors'); if (el) { el.checked = false; el.closest('.overlay-toggle').classList.remove('active'); } }
    if (state.scope) { const el = document.getElementById('scope-filter'); if (el) el.value = state.scope; }
    if (state.layout) { const el = document.getElementById('layout-select'); if (el) el.value = state.layout; }
    if (state.color) {
      COLOR_BY = state.color;
      const el = document.getElementById('color-select');
      if (el) el.value = COLOR_BY;
      if (COLOR_BY === 'cluster' && !CLUSTERS_COMPUTED) {
        computeClusters();
        CLUSTERS_COMPUTED = true;
      }
      applyColorBy();
    }
    applyFilters();
    if (dsMatches) {
      if (state.sel) {
        const n = cy.getElementById(state.sel);
        if (n && !n.empty()) { n.select(); highlightNeighborhood(n); showNodeDetails(n.data()); openSidebar(); }
      }
      if (state.trace) traceContradiction(state.trace);
      if (state.zoom) cy.zoom(state.zoom);
      if (state.pan && state.pan.length === 2 && !isNaN(state.pan[0]) && !isNaN(state.pan[1])) cy.pan({ x: state.pan[0], y: state.pan[1] });
      // Focus commit must happen last: it .remove()s elements, so any
      // selection / trace / zoom-pan applied above still lands on the
      // full graph before we narrow it.
      if (state.focus) commitFocus();
    }
  } finally {
    RESTORING = false;
  }
}

window.addEventListener('DOMContentLoaded', () => { setupSidebarActions(); init(); });
</script>
